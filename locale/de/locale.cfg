aop-quantum-computer=Die letzte Grenze in der Forschung. Verwendet Quantenmechanik, um ein Zehntel aller Wissenschaftspakete zu verwenden. Zu gefährlich, um außerhalb des Weltraums verwendet zu werden.
aop-quantum-stabilizer=Ein extrem leistungsfähiges Upgrade für den [entity=beacon], das die Maschinen mittels Quantenmanipulation modernisiert.
aop-salvager=Diese leistungsstarke Aktualisierung des [entity=recycler] recycelt Produkte in eine höhere Qualität als das, was eingelegt wurde.
aop-advanced-assembling-machine=Größere Montagemaschine, die Moduleffekte enthält.
aop-core-miner=Die letzte Grenze im Bergbau. Grabe tief unter der Oberfläche der Planeten, um unzählige Ressourcen zu erhalten. Kann nur auf Planeten mit festen und dicht genug Oberflächen platziert werden, um tiefe Bergbauoperationen aufrechtzuerhalten.
aop-armory=Ermöglicht das hochfrequente Herstellen von Munition.
aop-synthesizer=Mit fortschrittlichen chemischen Prozessen kann diese Maschine Materialien aus Grundressourcen synthetisieren.
aop-biomass-reactor=Elektrischer Generator, der Energie aus biologischer Materie erzeugen kann.
aop-transmitter=Gute Dinge kommen in kleinen Paketen.

